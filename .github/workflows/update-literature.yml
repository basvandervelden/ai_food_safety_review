name: Refresh literature

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/update-literature.yml'
  schedule:
    - cron: '15 6 * * 1' # Monday 06:15 UTC
  workflow_dispatch:

jobs:
  update:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[full-refresh]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify OpenAlex API key
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          if [ -z "$OPENALEX_API_KEY" ]; then
            echo "::error::Missing OPENALEX_API_KEY. Get a free key at https://openalex.org/settings/api and add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - name: Search all publications from 1 January 2024 through today
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python agent/update.py --start-date 2024-01-01 --per-query 100 --max-pages 8
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pre-render HTML and CSV for no-JavaScript viewing
        run: python agent/render_static.py
      - name: Validate generated data
        run: python -m unittest discover -s tests -v
      - name: Commit updated evidence index
        run: |
          git config user.name "living-review-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/papers.csv data/papers.json data/papers.js data/digest.json data/digest.js data/review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "data: weekly literature refresh"
            git push
          fi

  deploy:
    # Opt-in: enable GitHub Pages and set repository variable PUBLISH_PAGES=true.
    # Direct deployment is necessary because bot commits do not trigger a Pages build.
    if: ${{ always() && vars.PUBLISH_PAGES == 'true' && (needs.update.result == 'success' || (github.event_name == 'push' && needs.update.result == 'skipped')) }}
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh static charts for the complete indexed dataset
        run: |
          python agent/render_static.py
          python -m unittest discover -s tests -v
      - name: Prepare public site files
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp assets/app.js assets/landscape.js assets/styles.css _site/assets/
          cp data/papers.json data/papers.js data/papers.csv data/digest.json data/digest.js _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
