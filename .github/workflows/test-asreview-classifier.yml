name: Validate ASReview classifier

on:
  push:
    branches: [main]
    paths:
      - 'agent/asreview_classifier.py'
      - 'tests/test_asreview_classifier.py'
      - 'requirements-classifier.txt'
      - '.github/workflows/test-asreview-classifier.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install classifier dependencies
        run: python -m pip install -r requirements-classifier.txt
      - name: Import tests and synthetic end-to-end model evaluation
        run: python -m unittest discover -s tests -p 'test_asreview_classifier.py' -v
